  <script>
    (() => {
      const slides = Array.from(document.querySelectorAll(".slide"));
      const counter = document.querySelector("#counter");
      const controls = document.querySelector("#controls");
      let current = 0;
      let lastPointer = null;
      function revealControlsAt(x, y) {
        const rect = controls.getBoundingClientRect();
        const pad = 22;
        const inside = x >= rect.left - pad && x <= rect.right + pad && y >= rect.top - pad && y <= rect.bottom + pad;
        controls.classList.toggle("revealed", inside);
      }
      function show(index) {
        current = Math.max(0, Math.min(slides.length - 1, index));
        slides.forEach((slide, slideIndex) => {
          const active = slideIndex === current;
          slide.classList.toggle("active", active);
          slide.setAttribute("aria-hidden", active ? "false" : "true");
          slide.querySelectorAll("video").forEach((video) => {
            if (active) { video.currentTime = 0; video.play().catch(() => {}); }
            else { video.pause(); }
          });
        });
        counter.textContent = (current + 1) + " / " + slides.length;
        history.replaceState(null, "", "#" + (current + 1));
        if (lastPointer) revealControlsAt(lastPointer.x, lastPointer.y);
        else controls.classList.remove("revealed");
      }
      function goNext() { show(current + 1); }
      function goPrev() { show(current - 1); }
      document.addEventListener("pointermove", (event) => { lastPointer = { x:event.clientX, y:event.clientY }; revealControlsAt(event.clientX, event.clientY); });
      document.addEventListener("mousemove", (event) => { lastPointer = { x:event.clientX, y:event.clientY }; revealControlsAt(event.clientX, event.clientY); });
      document.addEventListener("pointerleave", () => { lastPointer = null; controls.classList.remove("revealed"); });
      document.addEventListener("mouseleave", () => { lastPointer = null; controls.classList.remove("revealed"); });
      document.querySelector("#prev").addEventListener("click", goPrev);
      document.querySelector("#next").addEventListener("click", goNext);
      document.querySelector("#deck").addEventListener("click", (event) => { if (!event.target.closest("button, video")) goNext(); });
      document.addEventListener("keydown", (event) => {
        if (["ArrowRight", "PageDown", " "].includes(event.key)) { event.preventDefault(); goNext(); }
        else if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); goPrev(); }
        else if (event.key === "Home") show(0);
        else if (event.key === "End") show(slides.length - 1);
      });
      window.addEventListener("hashchange", () => {
        const target = Number.parseInt(location.hash.slice(1), 10);
        if (Number.isFinite(target)) show(target - 1);
      });
      const initial = Number.parseInt(location.hash.slice(1), 10);
      show(Number.isFinite(initial) ? initial - 1 : 0);
    })();
  </script>
</body>
</html>
